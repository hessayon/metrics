[project]
name = "teammetrics"
version = "0.1.0"
description = "Jira and Bitbucket team metrics CLI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "atlassian-python-api>=4.0.7",
    "python-dotenv>=1.1.1",
]

[project.scripts]
teammetrics = "teammetrics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.12.12",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D1", "D203", "D213", "EM", "FA", "FBT", "ISC001", "TRY003"]

[tool.ruff.lint.extend-per-file-ignores]
"tests/*.py" = ["PLR0913", "PLR0917", "PLR2004", "S101", "S106"]
